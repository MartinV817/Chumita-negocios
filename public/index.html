<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060C1C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Empresa Chumita</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#060C1C;--card:#0D1628;--line:#1B2740;--fld:#1E2A44;--ink:#EAF1FB;--mute:#8A9BB3;--cy:#35DDE6;--in:#41D885;--out:#FA5F63;--y:#FFC21A;--gr:linear-gradient(135deg,#FFE45C 0%,#FFB000 45%,#FF7A1A 100%);--gr2:linear-gradient(135deg,#FFB000 0%,#FF7A1A 55%,#F2420C 100%);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:radial-gradient(110% 55% at 0% 0%,#06406b 0%,transparent 60%),radial-gradient(90% 45% at 100% 100%,rgba(255,122,26,.22) 0%,transparent 65%),#060C1C;background-attachment:fixed;font:400 16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink);background:var(--fld);border:1.5px solid var(--fld);border-radius:14px;padding:12px 13px;width:100%}
input::placeholder{color:#6F819B}
input:focus,button:focus-visible{outline:3px solid var(--cy);outline-offset:1px}
input[type=checkbox]{width:22px;height:22px;padding:0;accent-color:#FFB000;flex:none}
.hide{display:none!important}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:480px;margin:0 auto;padding:14px 14px 0}
.top{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.brand{flex:1;display:flex;align-items:center;gap:10px;min-width:0}.logo{width:46px;height:46px;flex:none}
.brand h1{font-size:15px;font-weight:800;line-height:1.2;background:var(--gr);-webkit-background-clip:text;background-clip:text;color:transparent}
.ib{width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,194,26,.25);background:var(--fld);display:grid;place-items:center;flex:none;position:relative}
.ib .bdg{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--out);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 15px;font-weight:600;color:var(--mute)}
.tabs button.on{background:var(--gr);color:#1A1000;border-color:transparent}
.dates{display:flex;gap:10px;margin:0 0 12px}.dates label{flex:1;font-size:13px;color:var(--mute)}.dates input{margin-top:4px;padding:9px 12px;border-radius:12px}
.card{background:linear-gradient(180deg,rgba(255,194,26,.06),transparent 45%),var(--card);border:1px solid rgba(255,194,26,.18);border-radius:22px;padding:16px;margin-bottom:12px}
.hd{display:flex;justify-content:space-between;color:var(--mute);font-size:14px}
.big{font-size:36px;font-weight:800;letter-spacing:-.5px;line-height:1.15;background:var(--gr);-webkit-background-clip:text;background-clip:text;color:transparent}
.neg{background:none;color:var(--out);-webkit-text-fill-color:var(--out)}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kp div{background:rgba(30,42,68,.7);border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--mute)}.kp b{display:block;font-size:17px;color:var(--ink)}
.in{color:var(--in)}.out{color:var(--out)}
.mid{display:flex;gap:16px;align-items:center;margin-top:14px}.donut{width:96px;height:96px;flex:none}.leg{flex:1;font-size:14px}.leg div{margin-bottom:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.pill{margin-top:12px;background:var(--fld);border-radius:999px;padding:9px;text-align:center;font-size:14px;color:var(--mute)}.pill b{color:var(--ink)}
.sec{font-weight:800;font-size:17px;margin:4px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sub{font-size:13px;color:var(--mute)}
.exp{display:flex;gap:8px;margin-bottom:12px}.exp button{flex:1;border:1.5px solid rgba(255,194,26,.45);background:transparent;color:#FFD34D;border-radius:14px;padding:11px 6px;font-weight:600}
.hh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hbtn{flex:1;background:none;border:0;text-align:left;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;padding:4px 0;min-width:120px}
.hbtn .chev{transition:transform .2s}.hbtn[aria-expanded=true] .chev{transform:rotate(180deg)}
.mini{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;color:#FFD34D}.mini.on{background:var(--gr);color:#1A1000;border-color:transparent}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.row .d{width:42px;font-size:13px;color:var(--mute);flex:none}.row .m{flex:1;min-width:0}.row .m b{display:block;font-weight:600}
.row .m span{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.row .a{text-align:right;font-weight:800}.row .a small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.row.ed{cursor:pointer;background:rgba(255,194,26,.08);border-radius:12px;padding-left:8px;padding-right:8px}
.ph{background:none;border:0;color:var(--cy);padding:4px}
.empty{text-align:center;color:var(--mute);padding:16px 0}
.bds{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.bd{font-style:normal;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--mute);background:none}
.bd.w{border-color:#E5A800;color:#FFC21A}.bd.ok{border-color:var(--in);color:var(--in)}.bd.m{border-color:var(--cy);color:var(--cy)}.bd.r{border-color:var(--out);color:var(--out)}.bd.a{border-color:#FFB000;color:#1A1000;background:var(--gr);font-weight:700}.bd.p{border-color:#FF7A1A;color:#1A0A00;background:var(--gr2);font-weight:700}
button.bd{cursor:pointer}
.ln{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.ln:first-of-type{border-top:0}.ln span{color:#C5D2E4}.ln b{white-space:nowrap}
.ln.t{font-weight:800;border-top:1.5px solid rgba(255,194,26,.45);color:#FFD34D}.ln.t span{color:#FFD34D}
.blk h3{font-size:17px;font-weight:800;background:var(--gr);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:2px}
.note{font-size:13px;color:var(--mute);margin:0 0 8px}
.chk{text-align:center;font-size:13px;color:var(--in);margin:2px 0 12px}
.fl{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.acts{position:sticky;bottom:0;display:flex;gap:12px;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,#060C1C 35%)}
.acts button{flex:1;border:0;border-radius:24px;padding:16px 8px 14px;font-size:19px;font-weight:800;color:#1A0E00;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.acts small{font-size:11.5px;font-weight:600;opacity:.8}.acts .ic{width:30px;height:30px}
.bA{background:var(--gr)}.bP{background:var(--gr2)}
.shade{position:fixed;inset:0;background:rgba(2,6,16,.72);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#0B1426;border:1px solid rgba(255,194,26,.22);width:100%;max-width:480px;border-radius:26px 26px 0 0;max-height:94%;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 10px}
.sh h2{font-size:20px;font-weight:800;background:var(--gr);-webkit-background-clip:text;background-clip:text;color:transparent}
.x{width:38px;height:38px;border-radius:50%;border:0;background:var(--fld);color:var(--ink);font-size:17px;flex:none}
.sb{overflow:auto;padding:0 18px 20px}
.lb{font-weight:800;margin:14px 0 8px;display:block}.lb small{font-weight:400;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid #2B3A57;background:transparent;border-radius:999px;padding:9px 15px;font-weight:600}.chip.alt{opacity:.55;font-weight:400}.chip.add{border-style:dashed;color:var(--mute)}
.chip.on{background:var(--gr);border-color:transparent;color:#1A1000;opacity:1}
.tip{margin-top:12px;background:var(--fld);border-radius:14px;padding:11px 14px;font-size:14.5px;color:#C5D2E4}
.tip.ex{background:rgba(255,176,0,.12);border:1px solid rgba(255,176,0,.35);color:#FFE9B0}
.seg{display:flex;gap:8px}.seg button{flex:1;border:1.5px solid #2B3A57;background:var(--fld);border-radius:16px;padding:13px;font-size:16px;font-weight:800}
.seg button.on{background:var(--gr);border-color:transparent;color:#1A1000}
.amt{font-size:28px;font-weight:800;border:2px solid #FFB000;padding:14px}
.two{display:flex;gap:10px}.two>div{flex:1;min-width:0}
.ck{display:flex;align-items:center;gap:12px;margin:12px 0 4px;font-size:15px;cursor:pointer}
.ck.big{background:var(--fld);border-radius:14px;padding:12px 14px}.ck.big b{display:block}.ck.big small{color:var(--mute);font-weight:400}
.photo{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--fld);border-radius:14px;padding:12px 10px;font-weight:600;cursor:pointer;min-height:48px}
.save{width:100%;margin-top:16px;border:0;border-radius:18px;padding:16px;font-size:18px;font-weight:800;color:#1A0E00;background:var(--gr)}
.save.alt{background:var(--fld);color:var(--ink)}.save.dan{background:var(--fld);color:var(--out)}
.err{color:#FF9C93;min-height:20px;font-size:14px}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;margin-top:12px;font-size:14px}
.gl p{margin:0 0 10px;color:#C5D2E4}.gl b{color:var(--ink)}
.chart svg{width:100%;height:auto;display:block;margin-top:12px;border-radius:12px}#ri b{color:var(--ink)}
.pv{overflow-x:auto;border-radius:14px;margin:10px 0}.pv table{border-collapse:collapse;min-width:620px;width:100%;font-size:12px}
.pv th{background:#0D1628;color:#FFD34D;padding:9px 6px;border-bottom:1px solid #FFB000;font-size:11px;white-space:nowrap}
.pv td{padding:7px 6px;text-align:center;border-bottom:1px dashed #6b5400;color:#EAF1FB;white-space:nowrap}.pv td.l{text-align:left;white-space:normal;min-width:130px}
.pv td.ci{background:#DCE9F7;color:#06182A}.pv td.ce{background:#FADBD0;color:#3A1A20}.pv tr.sc td{background:#16233f;color:#FFD34D;font-weight:800;text-align:left}.pv tr.tt td{font-weight:800;border-top:1px solid #FFB000}.pv td.gy{background:#E3E7ED;color:#06182A}
.wban{margin:0 0 10px;padding:10px 14px;border-radius:14px;border:1px solid #6b5400;background:#2a2208;color:#FFD84D;font-size:14px;cursor:pointer}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--gr);color:#1A0E00;font-weight:700;padding:10px 18px;border-radius:999px;z-index:50;max-width:90%;text-align:center}
.boot{position:fixed;inset:0;z-index:35;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:radial-gradient(120% 90% at 0% 0%,#06406b 0%,#07152b 42%,#050a18 100%);transition:opacity .45s}.boot.off{opacity:0;pointer-events:none}
.boot .logo{width:86px;height:86px;animation:pulse 1.6s ease-in-out infinite}
.ld{width:120px;height:4px;border-radius:9px;background:#1E2A44;overflow:hidden}.ld i{display:block;width:40%;height:100%;background:var(--gr);border-radius:9px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}@keyframes pulse{50%{transform:scale(1.07);opacity:.85}}
.lock{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(120% 90% at 0% 0%,#06406b 0%,#07152b 42%,#050a18 100%);padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));transition:opacity .38s,transform .38s}.lock.out{opacity:0;transform:scale(1.04)}
.lk{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px}.lk .ic{width:46px;height:46px;margin:0 auto;color:var(--cy)}.lk h1{font-size:26px;font-weight:800}
.lk input{background:#1E2A44;border-color:#1E2A44;text-align:center;border-radius:18px;padding:16px;font-size:18px}.lk input:focus{outline:3px solid var(--cy)}
.lk .keep{display:flex;align-items:center;gap:10px;text-align:left;color:#A9B8CC;font-size:14px;cursor:pointer}.lk .keep input{width:20px;height:20px;padding:0;border-radius:6px}.lk .err{color:#FF9C93}
.entrar{border:0;border-radius:18px;padding:15px;font-size:17px;font-weight:700;background:var(--gr);color:#1A0E00}.entrar:disabled{opacity:.85;cursor:wait}.lk input:disabled{opacity:.6}
.sp{display:inline-block;width:16px;height:16px;border:2.5px solid #1A0E00;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}
.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.app.in{animation:fadeUp .5s ease both}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ore{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}.ore i{position:absolute;bottom:-30px;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.36}100%{transform:translateY(-75vh) rotate(160deg);opacity:0}}
body:not(.admin) .adm{display:none}
body.lector .tabs,body.lector .exp,body.lector .hist,body.lector .acts,body.lector #bm2m,body.lector #wban,body.lector #wk,body.lector #pres,body.lector .nolec{display:none}
@media (prefers-reduced-motion:reduce){.boot .logo,.ld i,.app.in,.sp,.ore i{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></symbol>

<symbol id="i-up" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 17V7M7.5 11.5 12 7l4.5 4.5"/></symbol>

<linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD84D"/><stop offset="1" stop-color="#F08A1C"/></linearGradient>

<symbol id="i-faro" viewBox="0 0 24 24"><path d="M9 21h6M10 21l1-12h2l1 12M10 9h4l-1-4h-2zM3.5 7l4 1M20.5 7l-4 1M12 2.5V4"/></symbol>
<symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.7.6 1 1.3 1 2.1h5c0-.8.3-1.5 1-2.1A6 6 0 0 0 12 3z"/></symbol>

</defs></svg>
<div id="boot" class="boot" aria-label="Cargando"><svg class="logo" viewBox="0 0 64 64"><use href="#i-logo"/></svg><div class="ld"><i></i></div></div>

<div id="lock" class="lock hide"><div class="lk">
  <svg class="ic"><use href="#i-lock"/></svg>
  <h1>Ingresa a tu cuenta</h1>
  <input id="mail" type="email" autocomplete="username" placeholder="Correo" aria-label="Correo">
  <input id="pin" type="password" autocomplete="current-password" placeholder="Contraseña" aria-label="Contraseña">
  <label class="keep"><input type="checkbox" id="keep" checked> Mantener sesión iniciada en este dispositivo</label>
  <div id="le" class="err"></div>
  <button class="entrar" id="enter">Entrar</button>
  <button class="link" id="linst" style="color:#FFD34D;margin:4px auto 0">📲 Instalar la app en este dispositivo</button>
</div></div>

<main id="main" class="app hide">
  <div class="top">
    <button class="ib" data-a="perf" aria-label="Mi cuenta"><svg class="ic"><use href="#i-user"/></svg></button>
    <div class="brand"><svg class="logo" viewBox="0 0 64 64" role="img" aria-label="Logo de la empresa"><use href="#i-logo"/></svg><div style="min-width:0"><h1>Servicios Generales Chumita EIRL</h1><small id="who" style="color:var(--mute)"></small></div></div>
    <button class="ib" id="bm2m" data-a="m2m" aria-label="Acuerdos verbales M2M" style="font-size:20px">🤝<span id="m2n" class="bdg hide"></span></button>
    <button class="ib" data-a="guide" aria-label="Guía de Hapi" style="color:var(--y)"><svg class="ic"><use href="#i-book"/></svg></button>
  </div>
  <div id="wban" class="wban hide" data-a="pers">⚠ <b id="wn"></b>. Toca para ver.</div>
  <nav class="tabs" id="tabs">
    <button data-a="tab" data-t="home" class="on">Inicio</button>
    <button data-a="tab" data-t="esf">Situación</button>
    <button data-a="tab" data-t="eer">Resultados</button>
    <button data-a="tab" data-t="fe">Flujo</button>
    <button data-a="tab" data-t="faro">Faro</button>
  </nav>
  <div class="dates"><label>Desde<input type="date" id="f"></label><label>Hasta<input type="date" id="t"></label></div>

  <section id="v-home">
    <div class="card">
      <div class="hd"><span>Dinero disponible</span><span id="dol"></span></div>
      <div class="big" id="kcaja"></div>
      <div class="sub" id="kdet"></div>
      <div class="kp">
        <div>Patrimonio<b id="kpat"></b></div><div>IGV<b id="kigv"></b></div>
        <div>Por cobrar<b id="kcob" class="in"></b></div><div>Por pagar<b id="kpag" class="out"></b></div>
      </div>
      <div class="mid nolec">
        <svg class="donut" viewBox="0 0 100 100" role="img" aria-label="Cobros frente a pagos"><g transform="rotate(-90 50 50)" fill="none" stroke-width="13"><circle cx="50" cy="50" r="40" stroke="#FA5F63" stroke-opacity=".7"/><circle id="arc" cx="50" cy="50" r="40" stroke="#41D885" stroke-dasharray="0 251.33"/></g></svg>
        <div class="leg">
          <div><span class="dot" style="background:var(--in)"></span>Cobros <b id="ti"></b></div>
          <div><span class="dot" style="background:var(--out)"></span>Pagos <b id="to"></b></div>
          <div class="sub">Sin gastos: <b id="ps"></b></div>
        </div>
      </div>
      <div class="pill nolec" id="cnt"></div>
    </div>
    <div class="card" id="wk"></div>
    <div class="exp"><button data-a="prev">Vista previa</button><button data-a="xls">Excel</button><button data-a="pdf">PDF</button></div>
    <section class="card hist">
      <div class="hh"><button class="hbtn" id="bh" data-a="bh" aria-expanded="false">Historial <span id="hn" style="color:var(--mute);font-weight:400"></span><svg class="ic chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><button class="mini" id="bfix" data-a="fix">Corregir</button></div>
      <div class="hide" id="list"></div>
    </section>
  </section>
  <section id="v-esf" class="hide"></section>
  <section id="v-eer" class="hide"></section>
  <section id="v-fe" class="hide"></section>
  <section id="v-faro" class="hide"></section>

  <div class="acts">
    <button class="bA" data-a="act"><svg class="ic"><use href="#i-up"/></svg>ACTIVO<small>lo que tengo o me deben</small></button>
    <button class="bP" data-a="pas"><svg class="ic"><use href="#i-down"/></svg>PASIVO<small>lo que debo o pagué</small></button>
  </div>
</main>

<div id="shade" class="shade hide"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast hide" role="status"></div>
<div class="ore" id="ore" aria-hidden="true"></div>

<script>
/* ===== Utilidades ===== */
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var fmt=function(n){return Math.abs(n).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2})};
var money=function(n){return (n<0?'−':'')+'S/ '+fmt(n)};
var usd=function(n){return '$ '+fmt(n)};
var pn=function(n){return (n<0?'-':'')+fmt(n)};
var r2=function(n){return Math.round((n+Number.EPSILON)*100)/100};
function iso(t){return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function today(){return iso(new Date())}
function dAdd(d,n){var t=new Date(d+'T12:00:00');t.setDate(t.getDate()+n);return iso(t)}
function fdate(d){return d?d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(0,4):''}
function dm(d){return d.slice(8)+'/'+d.slice(5,7)}
function nrm(c){return String(c).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
function num(v,dec){v=String(v).replace(',','.').replace(/[^\d.]/g,'');var i=v.indexOf('.');if(i>=0)v=v.slice(0,i+1)+v.slice(i+1).replace(/\./g,'').slice(0,dec);return v}
var MES=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
var tt;function toast(m){var t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(tt);tt=setTimeout(function(){t.classList.add('hide')},3200)}
var NAME='Servicios Generales Chumita EIRL';

/* ===== Estado ===== */
var S={ops:[],custom:[],workers:[],tc:3.452,from:today().slice(0,4)+'-01-01',to:today()};
var ROL=null,ME='',UID=null,NAMES={},READY=false,HASACC=false,WOK=false,NEEDNAME=false,MAIL='';
var TAB='home',FIX=false,FARO='v',F=null;

/* ===== Catálogo de conceptos ===== */
var ACT=[
 {n:'Venta',nat:'activo',h:'Vendiste algo. Hasta que te paguen, es un DERECHO A COBRAR.'},
 {n:'Alquiler',nat:'activo',h:'Alquilaste una máquina. Hasta que te paguen, es un DERECHO A COBRAR.'},
 {n:'Mantenimiento',nat:'activo',h:'Hiciste un servicio de mantenimiento. Hasta que te paguen, es un DERECHO A COBRAR.'},
 {n:'Aumento de capital propio',nat:'activo',h:'Dinero tuyo que pones en la empresa. Sube tu PATRIMONIO. No lleva IGV.'}
];
var PAS=[
 {n:'Compra',nat:'pasivo',h:'Compraste algo (repuestos, insumos). Es tu COSTO. Hasta que pagues, es un DERECHO A PAGAR.'},
 {n:'Gasto',nat:'pasivo',h:'Pagos del día a día: luz, transporte, suscripciones. Hasta que pagues, es un DERECHO A PAGAR.'},
 {n:'Remuneración',nat:'pasivo',h:'Sueldos y pagos al personal. Es un GASTO, normalmente sin IGV.'},
 {n:'Aumento de capital por terceros',nat:'pasivo',h:'Dinero prestado: entra a tu caja pero es una DEUDA. No sube tu patrimonio. No lleva IGV.'}
];
function cons(nat){return (nat==='activo'?ACT:PAS).concat(S.custom.filter(function(c){return c.nat===nat}))}
function allCons(){return ACT.concat(PAS,S.custom)}
function findCon(n){return allCons().filter(function(c){return c.n===n})[0]}
function kindOf(o){
  var c=nrm(o.c);
  if(/capital propio/.test(c))return 'capp';
  if(/capital/.test(c)&&/tercero/.test(c))return 'capt';
  if(o.nat==='activo')return 'ing';
  return /^compra/.test(c)?'cos':'gas';
}
function isOp(o){return o.k==='ing'||o.k==='cos'||o.k==='gas'}
function prep(o){
  o.a=+o.a||0;o.tc=+o.tc||1;
  o.p=r2(o.a*o.tc);o.igs=r2((+o.ig||0)*o.tc);o.bs=r2(o.p-o.igs);
  o.ds=o.det?r2((+o.detm||0)*o.tc):0;o.k=kindOf(o);
  if(!o.devd)o.devd=o.d;if(!o.liqd)o.liqd=o.d;
  return o;
}
function dueOf(o){return (o.plazo>0&&o.dev&&!o.liq)?dAdd(o.d,o.plazo):null}

/* ===== Motor contable =====
   Estado de situación financiera = foto a una fecha
   Estado de resultados = devengos del período (sin IGV)
   Flujo de efectivo = lo que de verdad se cobró o pagó */
function inD(o,t){return !!o.dev&&o.devd<=t}
function inL(o,t){return !!o.liq&&o.liqd<=t}
function esf(t){
  var r={caja:0,det:0,ar:0,antp:0,cf:0,ap:0,antc:0,df:0,loan:0,capital:0};
  S.ops.forEach(function(o){
    var k=o.k,D=inD(o,t),L=inL(o,t);
    if(k==='capp'){if(L){r.caja+=o.p;r.capital+=o.p}return}
    if(k==='capt'){if(L){r.caja+=o.p;r.loan+=o.p}return}
    if(o.nat==='activo'){
      if(L)r.caja+=o.p;
      if(D&&!L)r.ar+=o.p;
      if(L&&!D)r.antc+=o.p;
      if(D)r.df+=o.igs;
      if(L)r.det+=o.ds;
    }else{
      if(L)r.caja-=o.p;
      if(D&&!L)r.ap+=o.p;
      if(L&&!D)r.antp+=o.p;
      if(D)r.cf+=o.igs;
    }
  });
  Object.keys(r).forEach(function(k){r[k]=r2(r[k])});
  r.libre=r2(r.caja-r.det);
  r.activo=r2(r.caja+r.ar+r.antp+r.cf);
  r.pasivo=r2(r.ap+r.antc+r.df+r.loan);
  r.pat=r2(r.activo-r.pasivo);
  r.resac=r2(r.pat-r.capital);
  return r;
}
function eerr(f,t){
  var r={ing:0,cos:0,gas:0,v:[],c:[],g:[]};
  S.ops.forEach(function(o){
    if(!o.dev||o.devd<f||o.devd>t)return;
    if(o.k==='ing'){r.ing+=o.bs;r.v.push(o)}
    else if(o.k==='cos'){r.cos+=o.bs;r.c.push(o)}
    else if(o.k==='gas'){r.gas+=o.bs;r.g.push(o)}
  });
  [r.v,r.c,r.g].forEach(function(a){a.sort(function(x,y){return x.devd<y.devd?-1:x.devd>y.devd?1:0})});
  r.ing=r2(r.ing);r.cos=r2(r.cos);r.gas=r2(r.gas);
  r.mb=r2(r.ing-r.cos);r.res=r2(r.mb-r.gas);
  return r;
}
function fev(f,t){
  var ev=[];
  S.ops.forEach(function(o){
    if(!o.liq||o.liqd<f||o.liqd>t)return;
    var inn=(o.k==='capp'||o.k==='capt'||o.nat==='activo');
    ev.push({o:o,d:o.liqd,i:inn?o.p:0,e:inn?0:o.p});
  });
  ev.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});
  var run=0,ci=0,cg=0;
  ev.forEach(function(x){run+=x.i-x.e;ci+=x.i;if(x.o.k==='gas')cg+=x.e;x.m=r2(run);x.sg=r2(ci-cg)});
  return ev;
}
function ftot(ev){var t={i:0,e:0,g:0};ev.forEach(function(x){t.i+=x.i;t.e+=x.e;if(x.o.k==='gas')t.g+=x.e});t.i=r2(t.i);t.e=r2(t.e);t.g=r2(t.g);return t}
function wStart(d){var t=new Date(d+'T12:00:00'),w=(t.getDay()+6)%7;t.setDate(t.getDate()-w);return iso(t)}
function weekEnd(d){return dAdd(wStart(d),6)}
function margenes(ev){
  var D={},W={};
  ev.forEach(function(x){
    if(!isOp(x.o))return;
    var c=x.o.nat==='activo'?x.i:0,p=x.o.nat==='activo'?0:x.e;
    var a=D[x.d]=D[x.d]||{k:x.d,c:0,p:0};a.c+=c;a.p+=p;
    var we=weekEnd(x.d),b=W[we]=W[we]||{k:we,c:0,p:0};b.c+=c;b.p+=p;
  });
  function arr(m){return Object.keys(m).sort().map(function(k){var q=m[k];return{k:k,c:r2(q.c),p:r2(q.p),m:r2(q.c-q.p)}})}
  return{dia:arr(D),sem:arr(W)};
}
function indirecto(f,t){
  var a=esf(dAdd(f,-1)),b=esf(t),r=eerr(f,t);
  var d={ar:r2(b.ar-a.ar),antp:r2(b.antp-a.antp),cf:r2(b.cf-a.cf),ap:r2(b.ap-a.ap),antc:r2(b.antc-a.antc),df:r2(b.df-a.df)};
  var ind=r2(r.res-d.ar-d.antp-d.cf+d.ap+d.antc+d.df),dir=0;
  fev(f,t).forEach(function(x){if(isOp(x.o))dir+=x.i-x.e});
  dir=r2(dir);
  return{res:r.res,d:d,ind:ind,dir:dir,diff:r2(ind-dir)};
}
function pending(nat){
  return S.ops.filter(function(o){return o.nat===nat&&isOp(o)&&inD(o,S.to)&&!inL(o,S.to)}).sort(function(a,b){return a.d<b.d?-1:1});
}

/* ===== Pantallas ===== */
function natChip(o){return '<i class="bd '+(o.nat==='activo'?'a':'p')+'">'+(o.nat==='activo'?'ACTIVO':'PASIVO')+'</i>'}
function stateChip(o){
  var act=o.nat==='activo';
  if(o.k==='capp')return '<i class="bd a">Capital propio</i>';
  if(o.k==='capt')return '<i class="bd p">Préstamo</i>';
  var due=dueOf(o),late=due&&due<today();
  if(o.dev&&o.liq)return '<i class="bd ok">'+(act?'Cobrado':'Pagado')+'</i>';
  if(o.dev)return '<button class="bd '+(late?'r':'w')+'" data-a="liq" data-id="'+o.id+'">'+(act?'Por cobrar':'Por pagar')+(due?(late?' · vencido '+dm(due):' · vence '+dm(due)):'')+'</button>';
  if(o.liq)return '<button class="bd m" data-a="dev" data-id="'+o.id+'">Anticipo · devengar</button>';
  return '<button class="bd" data-a="dev" data-id="'+o.id+'">Pendiente · devengar</button>';
}
function rowHTML(o,showDate){
  var act=o.nat==='activo',u=o.cur==='USD',plus=(act||o.k==='capt');
  var sub=[o.cp,o.fac,o.x,o.by?('por '+o.by):''].filter(Boolean).join(' · ');
  var chips=natChip(o)+stateChip(o)+(o.m2m?'<i class="bd m">M2M</i>':'')+(o.det?'<i class="bd w">Detracción '+money(o.ds)+'</i>':'');
  return '<div class="row'+(FIX?' ed':'')+'" data-ed="'+o.id+'"><div class="d">'+dm(showDate||o.d)+'</div><div class="m"><b>'+esc(o.c)+'</b>'+(sub?'<span>'+esc(sub)+'</span>':'')+'<div class="bds">'+chips+'</div></div>'+(o.img?'<button class="ph" data-a="img" data-id="'+o.id+'" aria-label="Ver comprobante"><svg class="ic"><use href="#i-cam"/></svg></button>':'')+'<div class="a '+(plus?'in':'out')+'">'+(plus?'+':'−')+(u?usd(o.a):money(o.p))+'<small>'+(o.igs>0?'Base '+money(o.bs)+' · IGV '+money(o.igs):(u?money(o.p):''))+'</small></div></div>';
}
function ln(l,v,cls){return '<div class="ln'+(cls&&cls.indexOf('t')===0?' t':'')+'"><span>'+l+'</span><b'+(cls==='in'?' class="in"':cls==='out'?' class="out"':'')+'>'+money(v)+'</b></div>'}
function setNeg(el,v){el.textContent=money(v);el.classList.toggle('neg',v<0)}

function renderHome(){
  var e=esf(S.to),ev=fev(S.from,S.to),t=ftot(ev);
  setNeg($('#kcaja'),e.libre);
  $('#kdet').textContent=e.det>0?'+ '+money(e.det)+' en tu cuenta de detracciones (solo sirve para impuestos)':'';
  $('#kpat').textContent=money(e.pat);
  var ig=r2(e.cf-e.df);$('#kigv').textContent=ig>=0?money(ig)+' a favor':money(-ig)+' por pagar';
  $('#kcob').textContent=money(e.ar);$('#kpag').textContent=money(e.ap);
  var tot=t.i+t.e,pi=tot?t.i/tot*100:0;
  $('#arc').setAttribute('stroke-dasharray',(pi*2.5133).toFixed(2)+' 251.33');
  $('#ti').textContent=money(t.i);$('#to').textContent=money(t.e);$('#ps').textContent=money(r2(t.i-t.g));
  var inR=S.ops.filter(function(o){return o.d>=S.from&&o.d<=S.to}).sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:0});
  var na=inR.filter(function(o){return o.nat==='activo'}).length;
  $('#cnt').innerHTML='<b>'+inR.length+' operacion'+(inR.length===1?'':'es')+'</b> · '+na+' activo'+(na===1?'':'s')+' · '+(inR.length-na)+' pasivo'+(inR.length-na===1?'':'s');
  $('#hn').textContent='('+inR.length+')';
  $('#list').innerHTML=inR.map(function(o){return rowHTML(o)}).join('')||'<div class="empty">Aún no hay operaciones en estas fechas.<br>Toca ACTIVO o PASIVO para empezar.</div>';
  var ws=wStart(S.to),we=dAdd(ws,6),e2=fev(ws,we),t2=ftot(e2),r=eerr(ws,we),mg=margenes(e2).sem[0]||{m:0};
  $('#wk').innerHTML='<div class="sec"><span>Resumen de la semana</span><span class="sub">'+dm(ws)+' al '+dm(we)+'</span></div>'
    +ln('Cobros de la semana',t2.i,'in')+ln('Pagos de la semana',t2.e,'out')+ln('Margen semanal (efectivo)',mg.m)
    +ln('Ventas devengadas',r.ing)+ln('Costos y gastos devengados',r2(r.cos+r.gas))+ln('Resultado de la semana',r.res,'t');
}
function blk(title,sub,lines,total,tl){
  var h='<div class="card blk"><h3>'+title+'</h3><div class="note">'+sub+'</div>';
  lines.forEach(function(x){h+=ln(x[0],x[1])});
  return h+ln(tl,total,'t')+'</div>';
}
function pendBlock(nat){
  var L=pending(nat);
  return '<div class="card"><div class="sec"><span>'+(nat==='activo'?'Por cobrar':'Por pagar')+'</span><span class="sub">'+L.length+' documento'+(L.length===1?'':'s')+'</span></div>'+(L.map(function(o){return rowHTML(o)}).join('')||'<div class="empty">Nada pendiente.</div>')+'</div>';
}
function renderEsf(){
  var e=esf(S.to);
  $('#v-esf').innerHTML='<div class="note" style="margin:0 2px 8px">Estado de situación financiera · foto de la empresa al <b>'+fdate(S.to)+'</b></div>'
   +blk('ACTIVO','Lo que la empresa tiene o le deben',[['Efectivo (caja y bancos)',e.libre],['Cuenta de detracciones',e.det],['Derechos a cobrar',e.ar],['Anticipos entregados a proveedores',e.antp],['Crédito fiscal (IGV de tus compras)',e.cf]],e.activo,'TOTAL ACTIVO')
   +blk('PASIVO','Lo que la empresa debe',[['Derechos a pagar',e.ap],['Anticipos recibidos de clientes',e.antc],['Débito fiscal (IGV de tus ventas)',e.df],['Préstamos de terceros',e.loan]],e.pasivo,'TOTAL PASIVO')
   +blk('PATRIMONIO','Lo que de verdad es de los dueños',[['Capital propio',e.capital],['Resultados acumulados',e.resac]],e.pat,'TOTAL PATRIMONIO')
   +'<div class="chk">✓ Activo ('+money(e.activo)+') = Pasivo + Patrimonio ('+money(r2(e.pasivo+e.pat))+')</div>'
   +pendBlock('activo')+pendBlock('pasivo');
}
function devRows(L,showSign){
  return L.map(function(o){return '<div class="row" data-ed="'+o.id+'"><div class="d">'+dm(o.devd)+'</div><div class="m"><b>'+esc(o.c)+'</b><span>'+esc([o.cp,o.fac].filter(Boolean).join(' · ')||'—')+'</span></div><div class="a">'+money(o.bs)+'<small>IGV '+money(o.igs)+' · Total '+money(o.p)+'</small></div></div>'}).join('')||'<div class="empty">Sin devengos en estas fechas.</div>';
}
function renderEer(){
  var r=eerr(S.from,S.to);
  $('#v-eer').innerHTML='<div class="note" style="margin:0 2px 8px">Estado de resultados · lo que se <b>devengó</b> del '+dm(S.from)+' al '+dm(S.to)+' (montos sin IGV)</div>'
   +'<div class="card blk"><h3>RESULTADO</h3>'+ln('Ventas devengadas',r.ing,'in')+ln('(−) Costo de ventas (compras)',r.cos,'out')+ln('Margen bruto',r.mb,'t')+ln('(−) Gastos y remuneraciones',r.gas,'out')+ln('Resultado del período',r.res,'t')+'</div>'
   +'<div class="card"><div class="sec"><span>Devengos de venta</span><span class="sub">'+r.v.length+'</span></div>'+devRows(r.v)+'</div>'
   +'<div class="card"><div class="sec"><span>Devengos de costo</span><span class="sub">'+r.c.length+'</span></div>'+devRows(r.c)+'</div>'
   +'<div class="card"><div class="sec"><span>Devengos de gasto</span><span class="sub">'+r.g.length+'</span></div>'+devRows(r.g)+'</div>';
}
function evRows(L,col){
  return L.map(function(x){var o=x.o;return '<div class="row" data-ed="'+o.id+'"><div class="d">'+dm(x.d)+'</div><div class="m"><b>'+esc(o.c)+'</b><span>'+esc([o.cp,o.fac,o.x].filter(Boolean).join(' · ')||'—')+'</span></div><div class="a '+col+'">'+money(col==='in'?x.i:x.e)+'</div></div>'}).join('')||'<div class="empty">Sin movimientos de dinero.</div>';
}
function renderFe(){
  var ev=fev(S.from,S.to),t=ftot(ev),mg=margenes(ev),ind=indirecto(S.from,S.to),e0=esf(dAdd(S.from,-1)),e1=esf(S.to);
  var ins=ev.filter(function(x){return x.i>0}),outs=ev.filter(function(x){return x.e>0});
  var h='<div class="note" style="margin:0 2px 8px">Flujo de efectivo · lo que de verdad se <b>cobró y pagó</b> del '+dm(S.from)+' al '+dm(S.to)+'</div>'
   +'<div class="card blk"><h3>EFECTIVO</h3>'+ln('Efectivo al inicio',e0.caja)+ln('Ingresos (cobros y aportes)',t.i,'in')+ln('Egresos (pagos)',t.e,'out')+ln('Efectivo al final',e1.caja,'t')+'</div>'
   +'<div class="card"><div class="sec"><span>Ingresos</span><span class="sub">'+ins.length+'</span></div>'+evRows(ins,'in')+'</div>'
   +'<div class="card"><div class="sec"><span>Egresos</span><span class="sub">'+outs.length+'</span></div>'+evRows(outs,'out')+'</div>';
  function mrows(a){return a.slice(-14).reverse().map(function(x){return '<div class="ln"><span>'+dm(x.k)+'</span><b class="'+(x.m>=0?'in':'out')+'">'+money(x.m)+'</b></div>'}).join('')||'<div class="empty">Sin datos.</div>'}
  h+='<div class="card"><div class="sec"><span>Margen diario</span><span class="sub">cobros − pagos</span></div>'+mrows(mg.dia)+'</div>'
   +'<div class="card"><div class="sec"><span>Margen semanal</span><span class="sub">semana al domingo</span></div>'+mrows(mg.sem)+'</div>'
   +'<div class="card blk"><h3>MÉTODO INDIRECTO</h3><div class="note">Resultados − Situación financiera = efectivo de la operación</div>'
   +ln('Resultado del período',ind.res)+ln('(−) Más derechos a cobrar',-ind.d.ar)+ln('(−) Más anticipos a proveedores',-ind.d.antp)+ln('(−) Más crédito fiscal',-ind.d.cf)
   +ln('(+) Más derechos a pagar',ind.d.ap)+ln('(+) Más anticipos de clientes',ind.d.antc)+ln('(+) Más débito fiscal',ind.d.df)
   +ln('Efectivo de la operación (indirecto)',ind.ind,'t')+ln('Efectivo de la operación (directo)',ind.dir)
   +'<div class="chk">'+(ind.diff===0?'✓ Los dos métodos coinciden':'⚠ Diferencia de '+money(ind.diff))+'</div></div>';
  $('#v-fe').innerHTML=h;

var LAY=[],SHEETOPEN=false,TABL=false,EXITING=false,lastBack=0;

function sheet(title,body){

async function sync(){
  var err=0,reload=false,live={},i,o,r,old,id;
  for(i=0;i<S.custom.length;i++){var c=S.custom[i];if(!REM.cat[c.n]){r=await sb.from('categorias').insert({nombre:c.n,tipo:c.nat==='activo'?'in':'out'});if(r.error&&r.error.code!=='23505')err++;else REM.cat[c.n]=1}}
  S.ops.forEach(function(x){live[x.id]=1});
  for(id in REM.ops){if(!live[id]){r=await sb.from('movimientos').delete().eq('id',id);if(r.error)err++;else delete REM.ops[id]}}
  for(i=0;i<S.ops.length;i++){
    o=S.ops[i];var row=opRow(o);
    if(o.img&&o.img.indexOf('data:')===0){
      var up=UID+'/'+Date.now()+'.jpg',bl=await (await fetch(o.img)).blob();
      r=await sb.storage.from('comprobantes').upload(up,bl,{contentType:'image/jpeg'});
      if(r.error){err++;continue}

    }else if(!row.foto_path&&REM.ops[o.id])row.foto_path=REM.ops[o.id].foto_path;
    if(o.id<0){
      r=await sb.from('movimientos').insert(row).select().single();
      if(r.error){err++;continue}
      old=o.id;o.id=r.data.id;o._r=1;o.uid=UID;o.by=nmShow(ME);REM.ops[o.id]=opRow(rowOp(r.data));
    }else if(JSON.stringify(row)!==JSON.stringify(REM.ops[o.id])){
      r=await sb.from('movimientos').update(Object.assign({editado_en:new Date().toISOString()},row)).eq('id',o.id).select();
      if(r.error||!r.data||!r.data.length){err++;reload=true}else REM.ops[o.id]=row;
    }
  }
  if(ROL==='admin'&&+S.tc!==+REM.tc){r=await sb.from('config').upsert({clave:'tipo_cambio',valor:String(S.tc)},{onConflict:'clave'});if(!r.error)REM.tc=S.tc}

  if(reload)await loadAll();
}

function days(mode){
  var ev=fev(S.from,S.to),m={},arr=[],prev=0;
  ev.forEach(function(x){var d=m[x.d];if(!d){d=m[x.d]={d:x.d,open:prev,hi:prev,lo:prev,i:0,e:0};arr.push(d)}d.i+=x.i;d.e+=x.e;d.close=x.m;d.hi=Math.max(d.hi,x.m);d.lo=Math.min(d.lo,x.m);prev=x.m});
  return mode==='w'?weekly(arr):arr;
}
function tipos(){return fev(S.from,S.to).map(function(x){return{c:x.o.c,t:x.i>0?'in':'out',p:x.i>0?x.i:x.e}})}
function openResumen(){
  sheet('Resumen','<div class="sub" style="margin:0 0 10px">Efectivo del '+fdate(S.from)+' al '+fdate(S.to)+'</div><div class="seg" id="rt"><button data-a="rt" data-v="c" class="on">Días</button><button data-a="rt" data-v="w">Semanas</button><button data-a="rt" data-v="b">Barras</button><button data-a="rt" data-v="t">Por tipo</button></div><div class="sub" id="ri" style="min-height:44px;margin-top:8px"></div><div class="chart" id="rc"></div><div class="sub" id="rn"></div><button class="save" data-a="rpdf">Descargar resumen en PDF</button>');
  showRes('c');
}
function showRes(k){
  CMODE=k==='w'?'w':'c';
  var N={c:'Cada vela es un día: celeste si terminó con más efectivo que al empezar, roja si terminó con menos. La línea fina marca lo más alto y lo más bajo del día.',w:'Cada vela es una semana (lunes a domingo) y se cierra el último día de la semana: suma y resta todo lo que entró y salió en esos 7 días.',b:'Ingresos (verde) frente a egresos (rojo) de cada día.',t:'En qué se movió más el dinero: verde entra, rojo sale.'};
  $('#rc').innerHTML=k==='c'?svgCandles(days()):k==='w'?svgCandles(days('w')):k==='b'?svgBars(days()):svgTypes(tipos());
  $('#rn').textContent=N[k];
  $('#ri').innerHTML=(k==='c'||k==='w')?'Toca o pasa el cursor sobre una vela para ver los precios.':'';
  if(k==='c')bindCandles(days());if(k==='w')bindCandles(days('w'));
}
async function resumenPdf(){
  if(!(await need(PL)))return;
  try{
    var ev=fev(S.from,S.to),t=ftot(ev),doc=new jspdf.jsPDF({unit:'mm',format:'a4'}),lg=await svgPng(logoSvg(),256,256);
    band(doc,lg,'Resumen del '+fdate(S.from)+' al '+fdate(S.to));
    var P=await Promise.all([svgPng(svgCandles(days())),svgPng(svgBars(days())),svgPng(svgTypes(tipos())),svgPng(svgCandles(days('w')))]);
    doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(20,30,45);
    doc.text('Ingresos: S/ '+fmt(t.i)+'    Egresos: S/ '+fmt(t.e)+'    Efectivo del período: S/ '+pn(t.i-t.e),14,36);
    doc.text('Velas diarias: efectivo acumulado',14,46);doc.addImage(P[0],'PNG',14,49,182,91);
    doc.text('Ingresos y egresos por día',14,148);doc.addImage(P[1],'PNG',14,151,182,91);
    doc.addPage();doc.text('En qué se movió el dinero',14,18);doc.addImage(P[2],'PNG',14,21,182,91);
    doc.text('Velas semanales (suma y resta de cada semana)',14,122);doc.addImage(P[3],'PNG',14,125,182,91);
    dl('Resumen_Chumita_'+S.from+'_a_'+S.to+'.pdf',doc.output('arraybuffer'));
  }catch(e){toast('No se pudo preparar el resumen')}
}

/* ===== Entrada, sesión y bloqueo por inactividad ===== */
var KEEP=true,STO={
  getItem:function(k){var v=sessionStorage.getItem(k);if(v!==null){KEEP=false;return v}return localStorage.getItem(k)},
  setItem:function(k,v){if(KEEP){localStorage.setItem(k,v);sessionStorage.removeItem(k)}else{sessionStorage.setItem(k,v);localStorage.removeItem(k)}},
  removeItem:function(k){localStorage.removeItem(k);sessionStorage.removeItem(k)}
};
var IDLE=45*60*1000,LAST=Date.now(),LASTSAVE=0,busyNow=false;
function touch(){LAST=Date.now();if(LAST-LASTSAVE>20000){LASTSAVE=LAST;try{localStorage.setItem('hapi_last',String(LAST))}catch(e){}}}
function idleFor(){var t=+localStorage.getItem('hapi_last')||0;return Date.now()-Math.max(LAST,t)}
function showLock(){$('#main').classList.add('hide');$('#lock').classList.remove('hide');$('#pin').value='';$('#le').textContent=''}
function showMain(){
  var L2=$('#lock');L2.classList.add('out');setTimeout(function(){L2.classList.add('hide');L2.classList.remove('out')},380);
  var M=$('#main');M.classList.remove('hide');M.classList.remove('in');void M.offsetWidth;M.classList.add('in');
}
function bootOff(){var b=$('#boot');if(!b||b.classList.contains('off'))return;b.classList.add('off');setTimeout(function(){b.classList.add('hide')},520)}
function busy(on){busyNow=on;var b=$('#enter');b.disabled=on;b.innerHTML=on?'<span class="sp"></span>Entrando…':'Entrar';$('#mail').disabled=on;$('#pin').disabled=on}
async function lockNow(msg,force){
  if(!force&&$('#main').classList.contains('hide'))return;
  LAY.length=0;SHEETOPEN=false;TABL=false;hideSheet();
  if(READY&&ROL&&ROL!=='lector'&&!syncing){try{await sync()}catch(e){}}
  try{await sb.auth.signOut({scope:'local'})}catch(e){}
  S.ops=[];READY=false;TAB='home';
  try{localStorage.removeItem('hapi_last')}catch(e){}
  showLock();$('#mail').value=MAIL||'';$('#le').textContent=msg||'Se cerró la sesión por inactividad (45 minutos). Ingresa tu contraseña.';
  $('#pin').focus();
}
function idleStart(){
  ['pointerdown','keydown','touchstart','wheel','scroll','mousemove'].forEach(function(ev){document.addEventListener(ev,touch,{passive:true,capture:true})});
  setInterval(function(){if(idleFor()>IDLE)lockNow()},30000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&idleFor()>IDLE)lockNow()});
}
async function tryEnter(){
  if(busyNow)return;
  var em=$('#mail').value.trim(),pw=$('#pin').value;
  if(!em||!pw){
    $('#le').textContent=!em?'Escribe tu correo.':'Escribe tu contraseña.';
    var k=document.querySelector('.lk');k.classList.remove('shake');void k.offsetWidth;k.classList.add('shake');return;
  }
  busy(true);$('#le').textContent='';
  try{
    KEEP=$('#keep').checked;
    var r=await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error){
      var m=(String(r.error.message||'')+' '+String(r.error.name||'')).toLowerCase();
      $('#le').textContent=(/fetch|network|retryable/.test(m)||r.error.status===0)?'No se pudo conectar con el servidor. Abre la app desde tu sitio publicado en Cloudflare; la vista previa de Claude bloquea la conexión.':m.indexOf('not confirmed')>=0?'Tu correo aún no está confirmado en Supabase.':'Correo o contraseña incorrectos.';
      $('#pin').value='';busy(false);return;
    }
    $('#pin').value='';$('#le').textContent='';
    await enterApp();
  }catch(e){$('#le').textContent='No se pudo iniciar sesión. Revisa tu conexión.';busy(false)}
}
async function enterApp(){
  touch();
  try{await loadAll()}catch(e){toast('No se pudo cargar. Revisa tu internet.');busy(false);showLock();bootOff();return}
  S.ops.map(function(o){return o.d}).forEach(function(d){if(d<S.from)S.from=d;if(d>S.to)S.to=d});
  showTab('home');render();showMain();bootOff();busy(false);
  if(NEEDNAME&&ROL){await askName();render()}
}
async function logout(){await sb.auth.signOut();S.ops=[];READY=false;LAY.length=0;SHEETOPEN=false;TABL=false;TAB='home';hideSheet();showLock()}
function particles(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var M=[['#F2C94C','#B8860B'],['#E6EAEE','#8F9AA5'],['#D98A5B','#8C4A22']];
  var SH=['polygon(20% 0,80% 10%,100% 55%,70% 100%,25% 90%,0 45%)','polygon(50% 0,100% 50%,50% 100%,0 50%)','polygon(30% 5%,90% 20%,95% 75%,50% 100%,5% 70%)'];
  var o=$('#ore');
  for(var i=0;i<16;i++){
    var p=document.createElement('i'),m=M[i%3],s=10+Math.random()*14;
    p.style.cssText='left:'+(Math.random()*96).toFixed(1)+'%;width:'+s.toFixed(0)+'px;height:'+s.toFixed(0)+'px;background:linear-gradient(135deg,'+m[0]+','+m[1]+');clip-path:'+SH[(i+Math.floor(i/3))%3]+';animation-duration:'+(9+Math.random()*9).toFixed(1)+'s;animation-delay:-'+(Math.random()*14).toFixed(1)+'s';
    o.appendChild(p);
  }
}
/* ===== Instalar como app (PWA) ===== */
var DEF=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();DEF=e});
window.addEventListener('appinstalled',function(){DEF=null;toast('App instalada')});
function isStandalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true}
async function instalar(){
  if(isStandalone()){toast('La app ya está instalada en este dispositivo');return}
  if(DEF){DEF.prompt();try{await DEF.userChoice}catch(e){}DEF=null;return}
  var ua=navigator.userAgent,ios=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),pasos;
  if(ios)pasos='<p><b>En iPhone o iPad (con Safari):</b></p><p>1. Toca el botón <b>Compartir</b> (el cuadro con una flecha hacia arriba).</p><p>2. Elige <b>Agregar a pantalla de inicio</b>.</p><p>3. Toca <b>Agregar</b>.</p>';
  else if(/android/i.test(ua))pasos='<p><b>En Android (con Chrome):</b></p><p>1. Toca los <b>tres puntos</b> de arriba a la derecha.</p><p>2. Elige <b>Instalar app</b> (o <b>Agregar a la pantalla principal</b>).</p><p>3. Confirma.</p>';
  else pasos='<p><b>En computadora (Chrome o Edge):</b></p><p>1. Mira a la derecha de la barra de direcciones: aparece un ícono de <b>instalar</b>.</p><p>2. Tócalo y elige <b>Instalar</b>.</p>';
  sheet('Instalar la app','<div class="gl">'+pasos+'</div>');
}
function boot(){
  try{history.replaceState({s:'root'},'');history.pushState({s:'app'},'')}catch(e){}
  window.addEventListener('popstate',onPop);
  particles();
  $('#enter').onclick=tryEnter;$('#linst').onclick=instalar;
  $('#pin').addEventListener('keydown',function(e){if(e.key==='Enter')tryEnter()});
  if(isStandalone())$('#linst').classList.add('hide');
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
  if(!window.supabase){bootOff();showLock();$('#le').textContent='No se pudo cargar la conexión. Revisa tu internet.';return}
  sb=supabase.createClient(SB_URL,SB_KEY,{auth:{storage:STO,persistSession:true,autoRefreshToken:true}});
  $('#mail').addEventListener('keydown',function(e){if(e.key==='Enter')$('#pin').focus()});
  window.addEventListener('online',syncQ);idleStart();
  setInterval(function(){
    if(!READY||syncing||again||document.hidden||SHEETOPEN)return;
    if(S.ops.some(function(o){return o.id<0}))return;
    loadAll().then(render).catch(function(){});
  },60000);
  setTimeout(function(){if($('#main').classList.contains('hide')&&$('#lock').classList.contains('hide')&&!busyNow){showLock();bootOff()}},9000);
  sb.auth.getSession().then(function(r){
    var s=r.data.session,lt=localStorage.getItem('hapi_last');
    if(s&&lt!==null&&Date.now()-(+lt)>IDLE){MAIL=s.user.email||'';bootOff();lockNow('Pasaron más de 45 minutos sin usar la app. Ingresa tu contraseña.',true)}
    else if(s)enterApp();
    else{showLock();bootOff()}
  }).catch(function(){showLock();bootOff()});
}
boot();

</script>
