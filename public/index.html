<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Empresa Chumita</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#060C1C;--card:#0D1628;--line:#1B2740;--fld:#1E2A44;--ink:#EAF1FB;--mute:#8A9BB3;--cy:#35DDE6;--in:#41D885;--out:#FA5F63;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:radial-gradient(120% 70% at 0% 0%,#06406b 0%,#07152b 40%,#050a18 100%) fixed,var(--bg);font:400 16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:var(--ink);background:var(--fld);border:1.5px solid var(--fld);border-radius:16px;padding:13px 14px;width:100%}
input::placeholder{color:#6F819B}
input:focus,button:focus-visible{outline:3px solid var(--cy);outline-offset:1px}
.hide{display:none!important}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:460px;margin:0 auto;padding:16px 16px 0}
.top{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.top input{flex:1;background:transparent;border:1.5px solid var(--line);font-weight:600;font-size:18px}
.ib{width:46px;height:46px;border-radius:50%;border:0;background:var(--fld);display:grid;place-items:center;flex:none}
.ib.cy{color:var(--cy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px}
.hd{display:flex;justify-content:space-between;color:var(--mute);font-size:14px}
.big{font-size:40px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.neg{color:var(--out)}
.mid{display:flex;gap:18px;align-items:center;margin-top:12px}
.donut{width:104px;height:104px;flex:none}
.leg{flex:1;font-size:15px}
.leg div{margin-bottom:8px}
.leg .r{display:flex;justify-content:space-between;align-items:center}
.leg b{display:block}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.sg{display:flex;justify-content:space-between;color:var(--mute);font-size:14px}
.pill{margin-top:14px;background:var(--fld);border-radius:999px;padding:10px;text-align:center;font-size:14px;color:var(--mute)}
.pill b{color:var(--ink)}
.in{color:var(--in)}.out{color:var(--out)}
.dates{display:flex;gap:10px;margin:12px 0}
.dates label{flex:1;font-size:13px;color:var(--mute)}
.dates input{margin-top:4px;padding:9px 12px;border-radius:12px}
.list{margin-top:4px}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .d{width:42px;font-size:13px;color:var(--mute)}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-weight:600}
.row .m span{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.row .a{text-align:right;font-weight:800}
.row .a small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.row .ph{background:none;border:0;color:var(--cy);padding:4px}
.empty{text-align:center;color:var(--mute);padding:18px 0}
.acts{position:sticky;bottom:0;display:flex;gap:12px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px))}
.acts button{flex:1;border:0;border-radius:26px;padding:22px 8px 18px;font-size:19px;font-weight:800;color:#06182A;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.acts .ic{width:34px;height:34px}
.bi{background:var(--in)}.bo{background:var(--out)}
.shade{position:fixed;inset:0;background:rgba(2,6,16,.7);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#0B1426;border:1px solid var(--line);width:100%;max-width:460px;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:94%;overflow:auto}
.sheet h2{font-size:21px;font-weight:800;margin-bottom:12px}
.lb{font-weight:800;margin:14px 0 8px;display:block}
.lb small{font-weight:400;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid #2B3A57;background:transparent;border-radius:999px;padding:9px 15px;font-weight:600}
.chip.alt{opacity:.55;font-weight:400}
.chip.add{border-style:dashed;color:var(--mute)}
.chip.on{background:var(--cy);border-color:var(--cy);color:#06182A;opacity:1}
.tip{margin-top:12px;background:var(--fld);border-radius:14px;padding:11px 14px;font-size:15px;color:#C5D2E4}
.seg{display:flex;gap:10px}
.seg button{flex:1;border:1.5px solid #2B3A57;background:var(--fld);border-radius:18px;padding:16px;font-size:18px;font-weight:800}
.seg button.on{background:var(--cy);border-color:var(--cy);color:#06182A}
.amt{font-size:30px;font-weight:800;border:2px solid var(--cy);padding:16px}
.two{display:flex;gap:12px}.two>div{flex:1}
.photo{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--fld);border-radius:16px;padding:13px 10px;font-weight:600;cursor:pointer;min-height:50px}
.sub{font-size:13px;color:var(--mute);margin-top:6px}
.save{width:100%;margin-top:18px;border:0;border-radius:20px;padding:17px;font-size:19px;font-weight:800;color:#06182A}
.err{color:#FF9C93;min-height:20px;font-size:14px}
.gl p{margin:0 0 10px;color:#C5D2E4}.gl b{color:var(--ink)}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;margin-top:12px;font-size:14px}
.brand{flex:1;display:flex;align-items:center;gap:10px;min-width:0}.logo{width:48px;height:48px;flex:none}.brand h1{font-size:16px;font-weight:800;line-height:1.2}
.exp{display:flex;gap:10px;margin-bottom:12px}.exp button{flex:1;border:1.5px solid var(--cy);background:transparent;color:var(--cy);border-radius:16px;padding:12px;font-weight:600}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:14px}.gcard h3{display:flex;gap:10px;align-items:center;margin:0 0 12px;font-size:19px}.gcard b{display:block;font-size:17px}.gcard p{margin:0 0 12px;color:var(--mute);font-size:15px}
.gs{color:var(--mute);margin:8px 0 0}.gs b{color:var(--ink)}
.ojo{margin-top:14px;border:1px solid #1D6E78;background:#0B2230;border-radius:22px;padding:16px}.ojo h3{display:flex;gap:8px;align-items:center;color:var(--cy);margin:0 0 8px;font-size:18px}.ojo p{margin:0 0 10px;color:#DCE7F5}.ojo b{color:#fff}
.hh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hbtn{flex:1;background:none;border:0;text-align:left;font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px;padding:4px 0;min-width:120px}.hbtn .chev{transition:transform .2s}.hbtn[aria-expanded=true] .chev{transform:rotate(180deg)}
.mini{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;color:var(--cy)}.mini.on{background:var(--cy);color:#06182A;border-color:var(--cy)}
.row.ed{cursor:pointer;background:rgba(53,221,230,.08);border-radius:12px;padding-left:8px;padding-right:8px}
.chart svg{width:100%;height:auto;display:block;margin-top:12px;border-radius:12px}#rt button{padding:10px;font-size:15px}
#ri b{color:var(--ink)}
.fb{cursor:pointer}.fb.pend{border-left:3px solid var(--cy);padding-left:8px}.fb.pend small{color:var(--cy)}#ipv b{color:var(--ink)}
body:not(.admin) .adm{display:none}body.lector .exp,body.lector .hist,body.lector .acts,body.lector #pres{display:none}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--cy);color:#06182A;font-weight:600;padding:10px 18px;border-radius:999px;z-index:50;max-width:90%;text-align:center}
.lock{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(120% 90% at 0% 0%,#06406b 0%,#07152b 42%,#050a18 100%);padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.lk{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px}
.lk .ic{width:46px;height:46px;margin:0 auto;color:var(--cy)}
.lk h1{font-size:26px;font-weight:800}
.lk input{text-align:center;border-radius:18px;padding:16px;font-size:18px}
.entrar{border:0;border-radius:18px;padding:15px;font-size:17px;font-weight:600;background:var(--cy);color:#06182A}
.ore{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.ore i{position:absolute;bottom:-30px;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.36}100%{transform:translateY(-75vh) rotate(160deg);opacity:0}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M2 5.5C4.5 4 8 4 12 6.5c4-2.5 7.5-2.5 10-1v13c-2.5-1.5-6-1.5-10 1-4-2.5-7.5-2.5-10-1z"/><path d="M12 6.5v13"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 17V7M7.5 11.5 12 7l4.5 4.5"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 7v10M7.5 12.5 12 17l4.5-4.5"/></symbol>
<symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
<linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD84D"/><stop offset="1" stop-color="#F08A1C"/></linearGradient>
<symbol id="i-logo" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#0D1628" stroke="url(#gg)" stroke-width="3"/><g fill="#FFC21A"><rect x="16" y="39" width="34" height="9" rx="4.5"/><rect x="22" y="30" width="22" height="9" rx="1.5"/><rect x="29" y="21" width="11" height="10" rx="1.5"/><rect x="41" y="17" width="2" height="7"/><path d="M8 31h6v16H7z"/><path d="M50 37h5v8l-3 3-2-2z"/></g><path d="M14 41 25 36" stroke="#FFC21A" stroke-width="2.4" stroke-linecap="round"/><g fill="#0D1628"><rect x="31" y="23" width="6" height="5" rx="1"/><circle cx="23" cy="43.5" r="2.4"/><circle cx="33" cy="43.5" r="2.4"/><circle cx="43" cy="43.5" r="2.4"/></g><g fill="#35DDE6"><circle cx="27" cy="54" r="1.7"/><circle cx="32" cy="54" r="1.7"/><circle cx="37" cy="54" r="1.7"/></g></symbol>
<symbol id="i-faro" viewBox="0 0 24 24"><path d="M9 21h6M10 21l1-12h2l1 12M10 9h4l-1-4h-2zM3.5 7l4 1M20.5 7l-4 1M12 2.5V4"/></symbol>
<symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.7.6 1 1.3 1 2.1h5c0-.8.3-1.5 1-2.1A6 6 0 0 0 12 3z"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="3"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>
</defs></svg>

<div id="lock" class="lock hide"><div class="lk">
  <svg class="ic"><use href="#i-lock"/></svg>
  <h1>Ingresa a tu cuenta</h1>
  <input id="mail" type="email" autocomplete="username" placeholder="Correo" aria-label="Correo"><input id="pin" type="password" autocomplete="current-password" placeholder="Contraseña" aria-label="Contraseña">
  <div id="le" class="err"></div>
  <button class="entrar" id="enter">Entrar</button>
</div></div>

<main id="main" class="app hide">
  <div class="top">
    <button class="ib" id="bperf" aria-label="Mi cuenta"><svg class="ic"><use href="#i-user"/></svg></button>
    <div class="brand"><svg class="logo" viewBox="0 0 64 64" role="img" aria-label="Logo de la empresa"><use href="#i-logo"/></svg><div style="min-width:0"><h1>Servicios Generales Chumita EIRL</h1><small id="who" style="color:var(--mute)"></small></div></div>
    <button class="ib cy" id="bguide" aria-label="Guía de Hapi"><svg class="ic"><use href="#i-book"/></svg></button>
  </div>
  <section class="card">
    <div class="hd"><span>Dinero disponible</span><span id="dol"></span></div>
    <div class="big" id="bal"></div>
    <div class="mid">
      <svg class="donut" viewBox="0 0 100 100" role="img" aria-label="Ingresos frente a egresos"><g transform="rotate(-90 50 50)" fill="none" stroke-width="13"><circle cx="50" cy="50" r="40" stroke="#FA5F63" stroke-opacity=".7"/><circle id="arc" cx="50" cy="50" r="40" stroke="#41D885" stroke-dasharray="0 251.33"/></g></svg>
      <div class="leg">
        <div><div class="r"><span><i class="dot" style="background:var(--in)"></i>Ingresos</span><span id="pi" style="color:var(--mute)"></span></div><b id="ti"></b></div>
        <div><div class="r"><span><i class="dot" style="background:var(--out)"></i>Egresos</span><span id="po" style="color:var(--mute)"></span></div><b id="to"></b></div>
        <div class="sg"><span>Sin gastos</span><span id="ps"></span></div>
      </div>
    </div>
    <div class="pill" id="cnt"></div>
  </section>
  <div class="dates">
    <label>Desde<input type="date" id="f"></label>
    <label>Hasta<input type="date" id="t"></label>
  </div>
  <div class="exp"><button id="bxls">Exportar Excel</button><button id="bpdf">Exportar PDF</button></div>
  <section class="card hist" style="margin-bottom:12px"><div class="hh"><button class="hbtn" id="bf" aria-expanded="false"><svg class="ic" style="color:var(--cy)"><use href="#i-faro"/></svg>Faro <span id="fn" style="color:var(--mute);font-weight:400;font-size:14px"></span><svg class="ic chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><button class="mini" id="bimp">Importar</button></div><div class="list hide" id="flist"></div></section>
  <section class="card hist"><div class="hh"><button class="hbtn" id="bh" aria-expanded="false">Historial <span id="hn" style="color:var(--mute);font-weight:400"></span><svg class="ic chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><button class="mini" id="bfix">Corregir</button></div><div class="list hide" id="list"></div></section>
  <div class="acts">
    <button class="bi" id="bin"><svg class="ic"><use href="#i-up"/></svg>Ingresos</button>
    <button class="bo" id="bout"><svg class="ic"><use href="#i-down"/></svg>Egresos</button>
  </div>
</main>

<div id="shade" class="shade hide"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast hide" role="status"></div>
<div class="ore" id="ore" aria-hidden="true"></div>

<script>
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var fmt=function(n){return Math.abs(n).toLocaleString("es-PE",{minimumFractionDigits:2,maximumFractionDigits:2})};
var money=function(n){return (n<0?"−":"")+"S/ "+fmt(n)};
var usd=function(n){return "$ "+fmt(n)};
var r2=function(n){return Math.round(n*100)/100};
var today=function(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
var BASE=[
 {n:"Venta",t:"in",h:"Vendiste algo: entra dinero a tu caja."},
 {n:"Alquiler",t:"in",h:"Alquilaste una máquina: el cobro entra a tu caja."},
 {n:"Mantenimiento",t:"in",h:"Cobraste un servicio de mantenimiento: entra a tu caja."},
 {n:"Aumento de capital propio",t:"in",h:"Es dinero tuyo y no le debes a nadie, por eso va a Ingresos."},
 {n:"Compra",t:"out",h:"Compraste algo: tienes el bien pero ya no el dinero, por eso va a Egresos."},
 {n:"Anticipo",t:"out",h:"Pagar por adelantado sigue siendo dinero que sale: va a Egresos."},
 {n:"Gasto",t:"out",h:"Pagos del día a día (luz, suscripciones, transporte). No se recuperan, así que se restan de “Sin gastos”."},
 {n:"Aumento de capital por terceros",t:"out",h:"Es dinero prestado y no es propio, por eso va a Egresos."}
];
var S;
S=null;
if(!S)S={custom:[],ops:[],bank:[],from:today().slice(0,4)+"-01-01",to:today()};
if(S.v!==2){S.pin="102019";S.v=2}
S.tc=S.tc||3.452;S.custom=S.custom||[];S.bank=S.bank||[];
S.ops.forEach(function(o){if(o.p===undefined){o.p=o.a;o.cur="PEN"}});
function save(){try{localStorage.setItem("hapi",JSON.stringify(S));return true}catch(e){return false}}
function all(){return BASE.concat(S.custom)}
function num(v,dec){v=v.replace(",",".").replace(/[^\d.]/g,"");var i=v.indexOf(".");if(i>=0)v=v.slice(0,i+1)+v.slice(i+1).replace(/\./g,"").slice(0,dec);return v}
var tt;function toast(m){var t=$("#toast");t.textContent=m;t.classList.remove("hide");clearTimeout(tt);tt=setTimeout(function(){t.classList.add("hide")},3200)}

/* Contraseña */
function showLock(){$("#main").classList.add("hide");$("#lock").classList.remove("hide");$("#pin").value="";$("#le").textContent=""}
function tryEnter(){
  if($("#pin").value===S.pin){$("#pin").value="";$("#lock").classList.add("hide");$("#main").classList.remove("hide");render()}
  else{$("#le").textContent="Esa contraseña no coincide. Prueba otra vez.";$("#pin").value=""}
}
$("#enter").onclick=tryEnter;
$("#pin").addEventListener("keydown",function(e){if(e.key==="Enter")tryEnter()});


/* Pantalla principal */
function render(){
  $("#who").textContent=ME?ME+" · "+({admin:"administrador",editor:"editor",lector:"lector"}[ROL]||""):"";
  if(ROL==="lector"){renderLector();return}
  $("#f").value=S.from;$("#t").value=S.to;
  $("#dol").textContent="Dólar hoy: S/ "+S.tc;
  var sel=period();
  var ti=0,to=0,ni=0,no=0,tg=0;
  sel.forEach(function(o){if(o.t==="in"){ti+=o.p;ni++}else{to+=o.p;no++;if(o.c==="Gasto")tg+=o.p}});
  var bal=ti-to,tot=ti+to,pi=tot?ti/tot*100:0;
  var b=$("#bal");b.textContent=money(bal);b.className="big"+(bal<0?" neg":"");
  $("#arc").setAttribute("stroke-dasharray",(pi*2.5133).toFixed(2)+" 251.33");
  $("#ti").textContent=money(ti);$("#to").textContent=money(to);$("#ps").textContent=money(ti-tg);
  $("#pi").textContent=Math.round(pi)+"%";$("#po").textContent=(tot?Math.round(100-pi):0)+"%";
  var n=sel.length;$("#hn").textContent="("+n+")";renderFaro();
  $("#cnt").innerHTML="<b>"+n+" operacion"+(n===1?"":"es")+"</b> · <span class='in'>"+ni+" ingreso"+(ni===1?"":"s")+"</span> · <span class='out'>"+no+" egreso"+(no===1?"":"s")+"</span>";
  var h="";
  sel.slice().reverse().forEach(function(o){
    var dd=o.d.slice(8)+"/"+o.d.slice(5,7),u=o.cur==="USD";
    h+='<div class="row'+(fix?" ed":"")+'" data-ed="'+o.id+'"><div class="d">'+dd+'</div><div class="m"><b>'+esc(o.c)+'</b>'+((o.x||o.by)?'<span>'+(o.x?esc(o.x):'')+(o.x&&o.by?' · ':'')+(o.by?'por '+esc(o.by):'')+'</span>':'')+'</div>'+(o.img?'<button class="ph" data-img="'+o.id+'" aria-label="Ver comprobante"><svg class="ic"><use href="#i-cam"/></svg></button>':'')+'<div class="a '+(o.t==="in"?"in":"out")+'">'+(o.t==="in"?"+":"−")+(u?usd(o.a):money(o.p))+'<small>'+(u?money(o.p)+" · ":"")+'Saldo '+money(o.s)+'</small></div></div>';
  });
  $("#list").innerHTML=h||'<div class="empty">Aún no hay operaciones en estas fechas.<br>Toca Ingresos o Egresos para empezar.</div>';
}
$("#f").onchange=function(e){S.from=e.target.value||S.from;save();render()};
$("#t").onchange=function(e){S.to=e.target.value||S.to;save();render()};
$("#list").addEventListener("click",function(e){
  var b=e.target.closest("[data-img]");if(!b)return;
  var o=S.ops.filter(function(x){return x.id==b.dataset.img})[0];if(!o)return;

function nrm(c){return String(c).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
function pIso(v){

  var y=+m[3];if(y<100)y+=2000;return y+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');

function pNum(v){

  var s=String(v).trim();if(!s)return 0;
  var neg=/^\(.*\)$/.test(s)||/^-/.test(s)||/-\s*$/.test(s);

function parseBank(rows){
